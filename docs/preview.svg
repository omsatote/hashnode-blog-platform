<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Hashnode Blog Platform preview</title>
  <desc id="desc">A black and white developer blog interface with green animated network accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8fbf9"/>
      <stop offset="1" stop-color="#e6f5eb"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#21a366" stroke-opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="650" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="130" r="180" fill="#70d69b" fill-opacity=".16"/>
  <circle cx="1010" cy="130" r="110" fill="none" stroke="#21a366" stroke-opacity=".3"/>
  <circle cx="1010" cy="130" r="72" fill="#111"/>
  <text x="1010" y="122" fill="#fff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="3">LIVE</text>
  <text x="1010" y="166" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle">17</text>
  <g fill="#21a366">
    <circle cx="865" cy="85" r="5"/><circle cx="1110" cy="275" r="5"/><circle cx="760" cy="230" r="5"/>
  </g>
  <g stroke="#21a366" stroke-opacity=".35">
    <path d="M865 85L1010 130L1110 275M760 230L1010 130"/>
  </g>
  <rect x="74" y="58" width="1052" height="534" rx="18" fill="#fff" fill-opacity=".78" stroke="#d7e8dc" filter="url(#shadow)"/>
  <text x="116" y="108" fill="#111" font-family="Arial,sans-serif" font-size="26" font-weight="700">H hashnode</text>
  <text x="116" y="208" fill="#21a366" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">THE DEVELOPER COMMUNITY</text>
  <text x="116" y="282" fill="#111" font-family="Arial,sans-serif" font-size="64" font-weight="700">Ideas worth</text>
  <text x="116" y="350" fill="#111" font-family="Arial,sans-serif" font-size="64" font-weight="700">sharing.</text>
  <text x="116" y="393" fill="#64736a" font-family="Arial,sans-serif" font-size="20">Write clearly. Learn in public. Build together.</text>
  <rect x="116" y="438" width="470" height="56" rx="8" fill="#fff" stroke="#cbdacf"/>
  <text x="140" y="473" fill="#87958c" font-family="Arial,sans-serif" font-size="16">Search articles by title...</text>
  <rect x="586" y="438" width="110" height="56" rx="8" fill="#111"/>
  <text x="641" y="473" fill="#fff" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Search</text>
  <rect x="760" y="330" width="290" height="166" rx="14" fill="#e5f7eb" stroke="#bce6c9"/>
  <text x="790" y="370" fill="#21a366" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LIVE COMMUNITY</text>
  <text x="790" y="410" fill="#153e2a" font-family="Arial,sans-serif" font-size="25" font-weight="700">Build in public.</text>
  <text x="790" y="445" fill="#527260" font-family="Arial,sans-serif" font-size="15">Publish ideas and grow.</text>
  <rect x="790" y="460" width="145" height="36" rx="6" fill="#111"/>
  <text x="862" y="484" fill="#fff" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Start writing →</text>
</svg>
